<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="洁身自好 · 一个关于选择与后果的普法互动故事">
<title>洁身自好 · 普法互动故事</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070f;color:#e8ecf5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;background:#0b1020;overflow:hidden;box-shadow:0 0 40px #000}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}

/* 首页 */
#scr-title{justify-content:flex-end}
.title-art{position:absolute;inset:0}
.title-art svg{width:100%;height:100%;display:block}
.title-box{position:relative;padding:28px 24px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,7,15,.92) 22%,#05070f);text-align:center}
.badge{display:inline-block;font-size:12px;letter-spacing:2px;padding:4px 10px;border:1px solid #e0b25c88;color:#e0b25c;border-radius:20px;margin-bottom:12px}
h1{font-size:46px;letter-spacing:10px;font-weight:800;text-shadow:0 0 24px rgba(224,178,92,.35);margin-bottom:6px}
.sub{color:#a8b1c7;margin-bottom:22px;letter-spacing:2px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:600;color:#e8ecf5;transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#d9a441,#b97a1f);color:#1a1205;box-shadow:0 6px 20px rgba(217,164,65,.3)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.btn.danger{background:#7a2230}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{flex:1;font-size:14px}
.disclaimer{margin-top:16px;font-size:11px;color:#6d7690;line-height:1.6}

/* 状态栏 */
#stats{display:flex;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:#070b17;border-bottom:1px solid #1a2238;z-index:3}
.stat{flex:1;min-width:0;text-align:center;font-size:10.5px;color:#9aa4bd;position:relative}
.stat .lab{white-space:nowrap}
.stat .val{font-size:12px;font-weight:700;color:#e8ecf5;margin:1px 0 2px;transition:color .3s}
.stat .bar{height:4px;background:#1b2338;border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:2px;transition:width .6s}
.stat.flash-down .val{color:#ff6b6b}
.stat.flash-up .val{color:#5fd38d}

/* 场景 */
#scene{position:relative;flex:1 1 auto;min-height:36%;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;transition:opacity .5s}
#bg svg{width:100%;height:100%;display:block}
#bg.fade{opacity:0}
#chapter-card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,5,12,.86);z-index:4;text-align:center;animation:fadein .6s}
#chapter-card.show{display:flex}
#chapter-card .no{font-size:13px;letter-spacing:6px;color:#e0b25c;margin-bottom:10px}
#chapter-card .nm{font-size:30px;font-weight:800;letter-spacing:6px}
#chapter-card .tip{margin-top:14px;font-size:12px;color:#8892aa}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#toasts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none}
.toast{font-size:12px;padding:4px 10px;border-radius:14px;background:rgba(0,0,0,.65);animation:toast 2.4s forwards;font-weight:600}
.toast.up{color:#5fd38d}.toast.down{color:#ff7b7b}
@keyframes toast{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#btn-menu{position:absolute;left:8px;top:calc(52px + env(safe-area-inset-top));width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#cfd6e6;font-size:16px;z-index:6}

/* 对话面板 */
#panel{flex:0 0 auto;max-height:62%;overflow-y:auto;background:linear-gradient(#0e1428,#0a0f1f);border-top:1px solid #222c48;padding:12px 14px calc(14px + env(safe-area-inset-bottom));z-index:3}
#dialog{position:relative;min-height:96px;cursor:pointer;user-select:none;-webkit-user-select:none}
#speaker{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;margin-bottom:8px;background:#26304d;color:#e0b25c}
#speaker.narr{background:transparent;color:#7f89a3;padding-left:0}
#speaker.inner{background:#2c2440;color:#c9a8ff}
#text{font-size:16px;line-height:1.75;color:#e8ecf5;min-height:56px;white-space:pre-wrap}
#text.inner{color:#d7c6f5;font-style:italic}
#tap-hint{text-align:right;font-size:11px;color:#5f6984;margin-top:4px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
#extra:empty{display:none}
#extra{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:13px 14px;border-radius:12px;background:#18213a;border:1px solid #2b3658;color:#e8ecf5;font-size:15px;line-height:1.5;animation:slidein .35s backwards}
.choice:active{background:#243056}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.next-btn{align-self:flex-end;padding:10px 22px;border-radius:20px;background:#d9a441;color:#1a1205;font-weight:700;font-size:15px}

/* 法律提示卡 */
.lawcard{border-radius:12px;background:linear-gradient(135deg,#132a4a,#0f1d36);border:1px solid #2f5d99;padding:11px 13px;animation:slidein .4s}
.lawcard .lh{font-size:12px;font-weight:700;color:#7fb4ff;letter-spacing:1px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.lawcard .lh::before{content:"⚖";font-size:14px}
.lawcard.tip{background:linear-gradient(135deg,#183326,#10241a);border-color:#2f7a52}
.lawcard.tip .lh{color:#6fdc9c}.lawcard.tip .lh::before{content:"💡"}
.lawcard.health{background:linear-gradient(135deg,#3a1a24,#26121a);border-color:#8a3448}
.lawcard.health .lh{color:#ff8fa6}.lawcard.health .lh::before{content:"✚"}
.lawcard .lt{font-size:13.5px;line-height:1.7;color:#dbe3f2}
.lawcard .ls{margin-top:6px;font-size:11px;color:#7d8aa8;word-break:break-all}
.lawcard .ls a{color:#7d8aa8}

/* 结局页 */
.ending-wrap{padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.end-hero{position:relative;height:240px;overflow:hidden}
.end-hero svg{width:100%;height:100%;display:block}
.end-hero .ov{position:absolute;inset:0;background:linear-gradient(transparent 30%,#0b1020);display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.end-tag{font-size:12px;letter-spacing:3px;color:#e0b25c}
.end-tag.bad{color:#ff7b7b}.end-tag.good{color:#6fdc9c}
.end-title{font-size:30px;font-weight:800;letter-spacing:4px;margin-top:4px}
.end-sec{margin:14px 16px 0;padding:14px;border-radius:14px;background:#111830;border:1px solid #1f2945}
.end-sec h3{font-size:14px;color:#e0b25c;margin-bottom:8px;letter-spacing:1px}
.end-sec p,.end-sec li{font-size:14px;line-height:1.75;color:#d3dbea}
.end-sec ul{padding-left:18px}
.final-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.final-stats div{background:#0b1020;border-radius:8px;padding:8px 2px;font-size:11px;color:#8a94ad}
.final-stats b{display:block;font-size:15px;color:#e8ecf5;margin-top:2px}
.report li{list-style:none;margin-left:-18px;padding:6px 0;border-bottom:1px dashed #263052}
.report li:last-child{border:none}
.report b{color:#fff}
.end-btns{margin:16px;display:flex;flex-direction:column;gap:10px}

/* 通用页面 */
.page{padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.page-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;background:#0b1020}
.page-head h2{font-size:19px}
.back{background:none;color:#e0b25c;font-size:15px;padding:6px 4px}
.gcard{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border-radius:12px;background:#111830;border:1px solid #1f2945}
.gcard .gi{width:64px;height:64px;flex:none;border-radius:10px;overflow:hidden;background:#1a2340;display:flex;align-items:center;justify-content:center;font-size:26px;color:#3d4766}
.gcard .gi svg{width:100%;height:100%}
.gcard h4{font-size:15px;margin-bottom:3px}
.gcard p{font-size:12px;color:#8a94ad;line-height:1.5}
.gcard.locked h4{color:#56607c}
.progress{font-size:13px;color:#8a94ad;margin-bottom:12px}
.law-sec{margin-bottom:14px;padding:14px;border-radius:12px;background:#111830;border:1px solid #1f2945}
.law-sec h3{font-size:15px;color:#7fb4ff;margin-bottom:8px}
.law-sec p{font-size:13.5px;line-height:1.75;color:#d3dbea;margin-bottom:6px}
.law-sec blockquote{border-left:3px solid #2f5d99;padding:6px 10px;margin:6px 0;background:#0c1428;font-size:13px;line-height:1.7;color:#c7d3ea}
.law-sec .src{font-size:11px;color:#6d7a98;word-break:break-all;line-height:1.6}
.law-sec .src a{color:#7d95c4}
.law-note{font-size:12px;color:#6d7690;line-height:1.7;margin:6px 2px 16px}

/* 弹窗 */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-card{width:100%;max-width:340px;background:#121a33;border:1px solid #2b3658;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.modal-card h3{font-size:17px;text-align:center;margin-bottom:4px}
.modal-card p{font-size:13px;color:#a8b1c7;text-align:center;line-height:1.6}

/* svg动画 */
.siren-r{animation:sirenR .8s infinite}.siren-b{animation:sirenB .8s infinite}
@keyframes sirenR{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes sirenB{0%,49%{opacity:.08}50%,100%{opacity:1}}
.soft-r{animation:softR .8s infinite}.soft-b{animation:softB .8s infinite}
@keyframes softR{0%,49%{opacity:.22}50%,100%{opacity:.02}}
@keyframes softB{0%,49%{opacity:.02}50%,100%{opacity:.22}}
.twinkle{animation:blink 3s infinite}
.neon{animation:neon 2.2s infinite}
@keyframes neon{0%,100%{opacity:1}45%{opacity:.85}50%{opacity:.3}55%{opacity:.9}}
.rec{animation:blink 1s infinite}
.glow{animation:glow 2s infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@media (min-height:760px){#text{font-size:17px}}
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <section id="scr-title" class="screen active">
    <div class="title-art" id="title-art"></div>
    <div class="title-box">
      <div class="badge">普法互动故事</div>
      <h1>洁身自好</h1>
      <p class="sub">一念之差，代价是一个家</p>
      <button class="btn primary" id="btn-start">开始故事</button>
      <div class="row">
        <button class="btn ghost" id="btn-endings">结局收集 <span id="end-count">0/9</span></button>
        <button class="btn ghost" id="btn-law">法律知识</button>
      </div>
      <p class="disclaimer">故事纯属虚构，人物均为原创。法律条文均标注出处，仅供普法参考，不构成法律意见。</p>
    </div>
  </section>

  <!-- 游戏 -->
  <section id="scr-game" class="screen">
    <header id="stats"></header>
    <div id="scene"><div id="bg"></div><div id="chapter-card"></div><div id="toasts"></div></div>
    <div id="panel">
      <div id="dialog">
        <div id="speaker"></div>
        <div id="text"></div>
        <div id="tap-hint">轻触继续 ▾</div>
      </div>
      <div id="extra"></div>
    </div>
    <button id="btn-menu" aria-label="菜单">☰</button>
  </section>

  <!-- 结局 -->
  <section id="scr-ending" class="screen scroll">
    <div class="ending-wrap" id="ending-body"></div>
  </section>

  <!-- 结局收集 -->
  <section id="scr-gallery" class="screen scroll">
    <div class="page">
      <div class="page-head"><button class="back" data-go="title">‹ 返回</button><h2>结局收集</h2></div>
      <div id="gallery"></div>
    </div>
  </section>

  <!-- 法律知识 -->
  <section id="scr-law" class="screen scroll">
    <div class="page">
      <div class="page-head"><button class="back" data-go="back">‹ 返回</button><h2>法律知识</h2></div>
      <div id="lawbook"></div>
    </div>
  </section>

  <div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>
</div>
<script>/* 原创 SVG 场景插画（无真人形象） */
const ART = (() => {
  const W = 360, H = 300;
  const wrap = (inner, defs = '') =>
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${inner}</svg>`;
  // 伪随机，保证每次画面一致
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const sky = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;

  function skyline(y, color, winColor, count = 14, maxH = 120) {
    seed = 11; let s = '', x = -10;
    for (let i = 0; i < count; i++) {
      const w = 22 + rnd() * 30, h = 40 + rnd() * maxH;
      s += `<rect x="${x}" y="${y - h}" width="${w}" height="${h + 40}" fill="${color}"/>`;
      for (let wy = y - h + 8; wy < y - 6; wy += 11)
        for (let wx = x + 4; wx < x + w - 5; wx += 8)
          if (rnd() > 0.62) s += `<rect x="${wx}" y="${wy}" width="4" height="5" fill="${winColor}" opacity="${0.5 + rnd() * 0.5}"/>`;
      x += w + 2;
    }
    return s;
  }
  function stars(n = 30, maxY = 120) {
    seed = 3; let s = '';
    for (let i = 0; i < n; i++) s += `<circle class="${i % 3 ? '' : 'twinkle'}" cx="${rnd() * W}" cy="${rnd() * maxY}" r="${rnd() * 1.2 + .3}" fill="#fff" opacity="${.3 + rnd() * .6}"/>`;
    return s;
  }
  // 简化的人物剪影（无面部特征）
  function person(x, y, s = 1, c = '#1b2236', opts = {}) {
    const head = `<circle cx="${x}" cy="${y - 62 * s}" r="${11 * s}" fill="${c}"/>`;
    const body = `<path d="M${x - 17 * s} ${y} L${x - 15 * s} ${y - 38 * s} Q${x} ${y - 52 * s} ${x + 15 * s} ${y - 38 * s} L${x + 17 * s} ${y} Z" fill="${c}"/>`;
    const cap = opts.cap ? `<rect x="${x - 12 * s}" y="${y - 78 * s}" width="${24 * s}" height="${7 * s}" rx="${2 * s}" fill="${opts.cap}"/><rect x="${x - 14 * s}" y="${y - 72 * s}" width="${28 * s}" height="${3 * s}" fill="${opts.cap}"/>` : '';
    return head + body + cap;
  }

  const scenes = {
    title() {
      return wrap(`<rect width="360" height="300" fill="url(#g)"/>${stars(40, 140)}
        <circle cx="290" cy="60" r="22" fill="#f3e3b5" opacity=".9"/><circle cx="282" cy="54" r="22" fill="#0d1430"/>
        ${skyline(230, '#0a0f22', '#e0b25c', 16, 130)}
        <rect y="228" width="360" height="72" fill="#05070f"/>
        <g class="neon"><rect x="40" y="150" width="54" height="18" rx="3" fill="none" stroke="#ff4f8b" stroke-width="2"/></g>
        <path d="M180 300 L180 236" stroke="#e0b25c" stroke-width="1" opacity=".4"/>
        ${person(180, 262, 1.1, '#000')}
        <ellipse cx="180" cy="262" rx="40" ry="5" fill="#000" opacity=".5"/>`,
        sky('g', '#0d1430', '#2a1f3d'));
    },
    home() {
      return wrap(`<rect width="360" height="300" fill="#3b2a1e"/>
        <rect x="0" y="0" width="360" height="190" fill="#4a3526"/>
        <rect x="230" y="30" width="100" height="90" fill="#1d2a4a" stroke="#6b4c33" stroke-width="6"/>${''}
        <line x1="280" y1="30" x2="280" y2="120" stroke="#6b4c33" stroke-width="4"/>
        <circle cx="300" cy="55" r="8" fill="#f3e3b5" opacity=".8"/>
        <rect x="40" y="40" width="60" height="44" fill="#e9d9b6" stroke="#7a5a3c" stroke-width="4"/>
        <path d="M50 76 L62 58 L72 70 L80 62 L92 76Z" fill="#7aa36b"/><circle cx="84" cy="52" r="5" fill="#f0a64a"/>
        <line x1="180" y1="0" x2="180" y2="70" stroke="#2a1d14" stroke-width="2"/>
        <path d="M150 70 L210 70 L195 95 L165 95Z" fill="#f2c46d"/>
        <ellipse cx="180" cy="190" rx="150" ry="70" fill="#ffd27a" opacity=".18" class="glow"/>
        <ellipse cx="180" cy="215" rx="130" ry="26" fill="#8a5a36"/><rect x="60" y="215" width="240" height="60" fill="#6e4528"/>
        <ellipse cx="130" cy="208" rx="18" ry="6" fill="#f4f1ea"/><ellipse cx="180" cy="206" rx="22" ry="7" fill="#f4f1ea"/><ellipse cx="232" cy="208" rx="18" ry="6" fill="#f4f1ea"/>
        <ellipse cx="180" cy="203" rx="14" ry="4" fill="#d8763a"/><ellipse cx="130" cy="206" rx="10" ry="3" fill="#7fb35e"/><ellipse cx="232" cy="206" rx="10" ry="3" fill="#e8d27a"/>
        ${person(95, 210, .95, '#2a1d16')}${person(265, 210, .95, '#2a1d16')}${person(180, 195, .6, '#2a1d16')}`);
    },
    dinnerCold() {
      return wrap(`<rect width="360" height="300" fill="#1a2233"/>
        <rect x="230" y="30" width="100" height="90" fill="#0b1124" stroke="#2c3550" stroke-width="6"/>
        <line x1="280" y1="30" x2="280" y2="120" stroke="#2c3550" stroke-width="4"/>
        <line x1="180" y1="0" x2="180" y2="70" stroke="#111" stroke-width="2"/>
        <path d="M150 70 L210 70 L195 95 L165 95Z" fill="#9aa6bf" opacity=".6"/>
        <ellipse cx="180" cy="200" rx="140" ry="60" fill="#a8c4ff" opacity=".06"/>
        <ellipse cx="180" cy="215" rx="130" ry="26" fill="#3a3f52"/><rect x="60" y="215" width="240" height="60" fill="#2b3042"/>
        <ellipse cx="130" cy="208" rx="18" ry="6" fill="#c9cdd8"/><ellipse cx="180" cy="206" rx="22" ry="7" fill="#c9cdd8"/><ellipse cx="232" cy="208" rx="18" ry="6" fill="#c9cdd8"/>
        <rect x="250" y="160" width="40" height="55" rx="4" fill="#232838"/>
        ${person(95, 212, .95, '#0d111c')}
        <rect x="110" y="120" width="140" height="40" rx="8" fill="#000" opacity="0"/>`);
    },
    cake() {
      return wrap(`<rect width="360" height="300" fill="#1a2233"/>
        <rect x="30" y="40" width="90" height="70" fill="#f1ead8" transform="rotate(-4 75 75)"/>
        <path d="M48 92 Q60 70 72 92 Q84 70 96 92" stroke="#e86a7a" stroke-width="3" fill="none" transform="rotate(-4 75 75)"/>
        <circle cx="60" cy="62" r="7" fill="#f6c44f" transform="rotate(-4 75 75)"/>
        <ellipse cx="180" cy="222" rx="140" ry="28" fill="#3a3f52"/><rect x="40" y="222" width="280" height="60" fill="#2b3042"/>
        <rect x="140" y="170" width="80" height="44" rx="6" fill="#efe3d0"/><rect x="140" y="170" width="80" height="12" rx="6" fill="#f2a7b5"/>
        <line x1="170" y1="150" x2="170" y2="170" stroke="#f6e7a1" stroke-width="3"/><line x1="190" y1="150" x2="190" y2="170" stroke="#f6e7a1" stroke-width="3"/>
        <text x="180" y="204" text-anchor="middle" font-size="13" fill="#b45a6a" font-weight="700">10</text>
        <ellipse cx="180" cy="120" rx="120" ry="60" fill="#8fa8ff" opacity=".05"/>`);
    },
    hotel() {
      return wrap(`<rect width="360" height="300" fill="#22263a"/>
        <rect x="200" y="20" width="140" height="130" fill="url(#gs)"/>${''}

/* 游戏引擎 */
(() => {
  const $ = (s) => document.querySelector(s);
  const STAT_DEF = [
    { k: 'trust', n: '家庭信任', c: '#f2a65a' },
    { k: 'money', n: '钱包', c: '#e0c35c' },
    { k: 'rep', n: '名誉', c: '#7fb4ff' },
    { k: 'health', n: '健康', c: '#5fd38d' },
    { k: 'stress', n: '心理压力', c: '#ff6b8b' }
  ];
  const KEY = 'jieshen_endings_v1';
  let st = null, node = null, lineIdx = 0, typing = null, prevScreen = 'title';

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } },
    add(id) { const a = store.get(); if (!a.includes(id)) a.push(id); try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtMoney = (v) => (v < 0 ? '负债' + Math.abs(v).toLocaleString() : '¥' + v.toLocaleString());

  function show(id) {
    const cur = document.querySelector('.screen.active');
    if (cur && cur.id !== 'scr-law') prevScreen = cur.id.replace('scr-', '');
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 'scr-' + id));
    const el = $('#scr-' + id); if (el) el.scrollTop = 0;
  }

  /* ---------- 状态栏 ---------- */
  function renderStats(changed = {}) {
    $('#stats').innerHTML = STAT_DEF.map((d) => {
      const v = st.stats[d.k];
      const pct = d.k === 'money' ? Math.max(0, Math.min(100, v / 200)) : v;
      const cls = changed[d.k] ? (((d.k === 'stress') ? changed[d.k] < 0 : changed[d.k] > 0) ? 'flash-up' : 'flash-down') : '';
      return `<div class="stat ${cls}" data-k="${d.k}"><div class="lab">${d.n}</div><div class="val">${d.k === 'money' ? fmtMoney(v) : v}</div><div class="bar"><i style="width:${pct}%;background:${d.c}"></i></div></div>`;
    }).join('');
  }
  function applyFx(fx) {
    if (!fx) return;
    const changed = {};
    for (const k in fx) {
      if (!(k in st.stats)) continue;
      const before = st.stats[k];
      st.stats[k] = k === 'money' ? before + fx[k] : Math.max(0, Math.min(100, before + fx[k]));
      changed[k] = st.stats[k] - before;
      if (changed[k]) toast(k, changed[k]);
    }
    renderStats(changed);
  }
  function toast(k, d) {
    const def = STAT_DEF.find((x) => x.k === k);
    const good = k === 'stress' ? d < 0 : d > 0;
    const el = document.createElement('div');
    el.className = 'toast ' + (good ? 'up' : 'down');
    el.textContent = `${def.n} ${d > 0 ? '+' : '−'}${k === 'money' ? '¥' : ''}${Math.abs(d).toLocaleString()}`;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  /* ---------- 剧情 ---------- */
  function newGame() {
    st = { stats: { ...START_STATS }, flags: {}, path: [] };
    renderStats();
    show('game');
    go('p0');
  }
  function setBg(name) {
    const bg = $('#bg');
    if (bg.dataset.name === name) return;
    bg.classList.add('fade');
    setTimeout(() => { bg.innerHTML = ART.get(name); bg.dataset.name = name; bg.classList.remove('fade'); }, 180);
  }
  function go(id) {
    node = NODES[id];
    if (!node) { console.warn('missing node', id); return; }
    st.path.push(id);
    lineIdx = 0;
    $('#extra').innerHTML = '';
    setBg(node.bg);
    applyFx(node.fx);
    if (node.ch !== undefined) {
      const [no, nm] = CHAPTERS[node.ch];
      const cc = $('#chapter-card');
      cc.innerHTML = `<div class="no">${no}</div><div class="nm">${nm}</div><div class="tip">轻触继续</div>`;
      cc.classList.add('show');
      $('#dialog').style.visibility = 'hidden';
      const close = () => { cc.classList.remove('show'); cc.onclick = null; $('#dialog').style.visibility = ''; showLine(); };
      cc.onclick = close;
      clearTimeout(cc._t); cc._t = setTimeout(() => { if (cc.classList.contains('show')) close(); }, 1800);
    } else showLine();
  }
  function showLine() {
    const [sp, text] = node.lines[lineIdx];
    const spEl = $('#speaker'), tEl = $('#text');
    spEl.textContent = SPEAKERS[sp];
    spEl.className = sp === 'n' ? 'narr' : sp === 'in' ? 'inner' : '';
    tEl.className = sp === 'in' ? 'inner' : '';
    clearInterval(typing);
    let i = 0; tEl.textContent = '';
    tEl.dataset.full = text;
    typing = setInterval(() => {
      i += 2; tEl.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typing); typing = null; afterType(); }
    }, 22);
    $('#tap-hint').style.visibility = 'hidden';
  }
  function afterType() {
    const last = lineIdx >= node.lines.length - 1;
    $('#tap-hint').style.visibility = last ? 'hidden' : 'visible';
    if (last) renderExtra();
  }
  function advance() {
    if ($('#chapter-card').classList.contains('show')) return;
    const tEl = $('#text');
    if (typing) { clearInterval(typing); typing = null; tEl.textContent = tEl.dataset.full; afterType(); return; }
    if (lineIdx < node.lines.length - 1) { lineIdx++; showLine(); }
  }
  function lawCard(key) {
    const L = LAW[key]; if (!L) return '';
    const kind = L.k || 'law';
    const head = kind === 'law' ? '法律提示 · ' + L.t : L.t;
    return `<div class="lawcard ${kind === 'law' ? '' : kind}"><div class="lh">${esc(head)}</div><div class="lt">${esc(L.x)}</div>${L.s ? `<div class="ls">来源：<a href="${L.s}" target="_blank" rel="noopener">${esc(L.s)}</a></div>` : ''}</div>`;
  }
  function renderExtra() {
    const ex = $('#extra');
    if (ex.dataset.node === st.path.length + '') return;
    ex.dataset.node = st.path.length + '';
    let h = node.law ? lawCard(node.law) : '';
    if (node.choices) {
      h += node.choices.map((c, i) => `<button class="choice" data-i="${i}">${esc(c.t)}</button>`).join('');
    } else if (node.ending || node.endingFn) {
      h += `<button class="next-btn" id="btn-next">查看结局 ›</button>`;
    } else {
      h += `<button class="next-btn" id="btn-next">继续 ›</button>`;
    }
    ex.innerHTML = h;
    ex.querySelectorAll('.choice').forEach((b) => b.onclick = (e) => { e.stopPropagation(); choose(+b.dataset.i); });
    const nb = $('#btn-next');
    if (nb) nb.onclick = (e) => { e.stopPropagation(); next(); };
    requestAnimationFrame(() => { const p = $('#panel'); p.scrollTop = p.scrollHeight; });
  }
  function choose(i) {
    const c = node.choices[i];
    if (c.flag) st.flags[c.flag] = true;
    applyFx(c.fx);
    go(c.to);
  }
  function next() {
    if (node.ending || node.endingFn) return ending(node.ending || node.endingFn(st));
    go(node.next);
  }

  /* ---------- 结局 ---------- */
  const REPORT = `<ul class="report">
    <li><b>110</b>　紧急求助、举报涉黄违法活动</li>
    <li><b>96110</b>　反电信网络诈骗预警劝阻专线（咨询、举报）</li>
    <li><b>国家反诈中心APP</b>　一键举报涉诈线索、验证可疑账号</li>
    <li><b>www.12377.cn</b>　违法和不良信息举报中心（网络涉黄信息）</li>
    <li><b>当地疾控中心VCT门诊</b>　免费、保密的艾滋病咨询检测</li></ul>`;
  function ending(id) {
    const E = ENDINGS[id];
    store.add(id);
    updateCount();
    const s = st.stats;
    const tag = E.kind === 'good' ? '好结局' : E.kind === 'mid' ? '普通结局' : '坏结局';
    $('#ending-body').innerHTML = `
      <div class="end-hero">${ART.get(E.bg)}<div class="ov"><div class="end-tag ${E.kind === 'good' ? 'good' : E.kind === 'bad' ? 'bad' : ''}">${E.ch} · ${tag} · ${id}</div><div class="end-title">${esc(E.title)}</div></div></div>
      <div class="end-sec"><p>${esc(E.story)}</p></div>
      <div class="end-sec"><h3>最终状态</h3><div class="final-stats">
        <div>家庭信任<b>${s.trust}</b></div><div>钱包<b style="font-size:12px">${fmtMoney(s.money)}</b></div><div>名誉<b>${s.rep}</b></div><div>健康<b>${s.health}</b></div><div>心理压力<b>${s.stress}</b></div></div></div>
      <div class="end-sec"><h3>⚠ 警示</h3><ul>${E.lesson.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>
      <div class="end-sec"><h3>☎ 举报与求助渠道</h3>${REPORT}</div>
      <div class="end-btns">
        <button class="btn primary" id="btn-share">分享给朋友，一起洁身自好</button>
        <div class="row" style="margin:0"><button class="btn ghost" id="btn-again">再玩一次</button><button class="btn ghost" id="btn-e-gallery">结局收集 ${store.get().length}/9</button></div>
        <button class="btn ghost" id="btn-e-law">法律知识与出处</button>
        <button class="btn ghost" id="btn-e-home">返回首页</button>
      </div>`;
    $('#btn-share').onclick = () => share(E);
    $('#btn-again').onclick = newGame;
    $('#btn-e-gallery').onclick = () => { renderGallery(); show('gallery'); };
    $('#btn-e-law').onclick = () => { renderLaw(); show('law'); };
    $('#btn-e-home').onclick = () => show('title');
    show('ending');
  }
  async function share(E) {
    const text = `我在普法互动故事《洁身自好》里打出了结局「${E.title}」。一念之差，代价是一个家。嫖娼最高可拘留15日、罚款5000元，还会通知家属。洁身自好，远离黄赌毒！`;
    const url = /^https?:/.test(location.href) ? location.href : '';
    try {
      if (navigator.share) { await navigator.share({ title: '洁身自好 · 普法互动故事', text, ...(url ? { url } : {}) }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const full = text + (url ? ' ' + url : '');
    let ok = false;
    try { await navigator.clipboard.writeText(full); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = full; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    modal(`<h3>${ok ? '已复制分享文案' : '分享文案'}</h3><p style="text-align:left;user-select:text;-webkit-user-select:text">${esc(full)}</p><button class="btn primary" data-close>好的</button>`);
  }

  /* ---------- 结局收集 / 法律知识 ---------- */
  function updateCount() { $('#end-count').textContent = store.get().length + '/9'; }
  function renderGallery() {
    const got = store.get();
    $('#gallery').innerHTML = `<div class="progress">已收集 ${got.length} / 9 个结局</div>` +
      Object.entries(ENDINGS).map(([id, E]) => {
        const has = got.includes(id);
        return `<div class="gcard ${has ? '' : 'locked'}"><div class="gi">${has ? ART.get(E.bg) : '?'}</div><div><h4>${id} · ${has ? esc(E.title) : '？？？'}</h4><p>${has ? esc(E.story) : `${E.ch} · 尚未解锁`}</p></div></div>`;
      }).join('');
  }
  function renderLaw() {
    const link = (u) => `<a href="${u}" target="_blank" rel="noopener">${esc(u)}</a>`;
    $('#lawbook').innerHTML = `<p class="law-note">以下内容于2026年10月查证，条文均摘自公开发布的法律文本及官方机构页面，每一节下方注明出处。仅供普法参考，具体案件以公安、司法机关依法认定为准。</p>` +
      LAWBOOK.map((sec) => `<div class="law-sec"><h3>${esc(sec.h)}</h3>${sec.p.map((p) => `<p>${esc(p)}</p>`).join('')}${(sec.q || []).map((q) => `<blockquote>${esc(q)}</blockquote>`).join('')}<div class="src">来源：<br>${sec.s.map(link).join('<br>')}</div></div>`).join('');
  }

  /* ---------- 弹窗 / 菜单 ---------- */
  function modal(html) {
    $('#modal-card').innerHTML = html;
    $('#modal').classList.remove('hidden');
    $('#modal-card').querySelectorAll('[data-close]').forEach((b) => b.onclick = () => $('#modal').classList.add('hidden'));
  }
  function menu() {
    modal(`<h3>菜单</h3><button class="btn ghost" data-close>继续故事</button><button class="btn ghost" id="m-law">法律知识</button><button class="btn ghost" id="m-restart">重新开始</button><button class="btn ghost" id="m-home">返回首页</button>`);
    $('#m-law').onclick = () => { $('#modal').classList.add('hidden'); renderLaw(); show('law'); };
    $('#m-restart').onclick = () => { $('#modal').classList.add('hidden'); newGame(); };
    $('#m-home').onclick = () => { $('#modal').classList.add('hidden'); show('title'); };
  }

  /* ---------- 绑定 ---------- */
  $('#title-art').innerHTML = ART.get('title');
  updateCount();
  $('#btn-start').onclick = newGame;
  $('#btn-endings').onclick = () => { renderGallery(); show('gallery'); };
  $('#btn-law').onclick = () => { renderLaw(); show('law'); };
  $('#dialog').addEventListener('click', advance);
  $('#scene').addEventListener('click', (e) => { if (e.target.closest('#chapter-card')) return; advance(); });
  $('#btn-menu').onclick = (e) => { e.stopPropagation(); menu(); };
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('#modal').classList.add('hidden'); });
  document.querySelectorAll('.back').forEach((b) => b.onclick = () => {
    const to = b.dataset.go === 'back' ? (prevScreen === 'law' ? 'title' : prevScreen) : b.dataset.go;
    show(to);
  });
  document.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && $('#scr-game').classList.contains('active')) advance(); });
  window.__game = { get state() { return st; }, get node() { return node; } };
})();
</script>
</body>
</html>
